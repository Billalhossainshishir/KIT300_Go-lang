name: Sync Nomaan security backend

on:
  push:
    branches:
      - security-ux-integration

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: security-ux-integration
          fetch-depth: 0

      - name: Fetch pinned Nomaan security branch
        run: |
          git clone --no-checkout https://github.com/MISAN0/KIT300_Project_RamifyOS.git /tmp/nomaan
          git -C /tmp/nomaan checkout 1457c53a36445f4be3b5a4188c64ee752b98afef

      - name: Overlay security/backend files only
        shell: bash
        run: |
          set -euo pipefail
          files=(
            .gitattributes
            .gitignore
            requirements-dev.txt
            RAMIFY-Extended-Proof-Pack.zip
            backend/ramify/action/cart.py
            backend/ramify/agent/explain.py
            backend/ramify/agent/pydanticai_adapter.py
            backend/ramify/api/app.py
            backend/ramify/api/models.py
            backend/ramify/crypto/embedded_pubkeys.py
            backend/ramify/crypto/keys.py
            backend/ramify/crypto/sign.py
            backend/ramify/data/generated/artefacts/ev_apex_coa.txt
            backend/ramify/data/generated/artefacts/ev_apex_gmp.txt
            backend/ramify/data/generated/artefacts/ev_brightway-m_coa.txt
            backend/ramify/data/generated/artefacts/ev_brightway-m_gmp.txt
            backend/ramify/data/generated/artefacts/ev_brightway-z_coa.txt
            backend/ramify/data/generated/artefacts/ev_brightway-z_gmp.txt
            backend/ramify/data/generated/artefacts/ev_covelane_conformity.txt
            backend/ramify/data/generated/artefacts/ev_greenline_coa.txt
            backend/ramify/data/generated/artefacts/ev_greenline_gmp.txt
            backend/ramify/data/generated/artefacts/ev_harborline_conformity.txt
            backend/ramify/data/generated/artefacts/ev_merridale_conformity.txt
            backend/ramify/data/generated/artefacts/ev_northbeam_coa.txt
            backend/ramify/data/generated/artefacts/ev_northbeam_gmp.txt
            backend/ramify/data/generated/artefacts/ev_stonefield-gluc_coa.txt
            backend/ramify/data/generated/artefacts/ev_stonefield-gluc_gmp.txt
            backend/ramify/data/generated/artefacts/ev_stonefield-pico_coa.txt
            backend/ramify/data/generated/artefacts/ev_stonefield-pico_gmp.txt
            backend/ramify/data/generated/artefacts/ev_tidalpoint_coa.txt
            backend/ramify/data/generated/artefacts/ev_tidalpoint_gmp.txt
            backend/ramify/data/generated/artefacts/ev_tidalpoint_label.txt
            backend/ramify/data/generated/evidence_signatures.json
            backend/ramify/data/generated/record_signatures.json
            backend/ramify/data/seed.py
            backend/ramify/engine.py
            backend/ramify/policy/profiles.py
            backend/ramify/ratify/checks.py
            backend/ramify/ratify/precedence.py
            backend/ramify/ratify/verify.py
            backend/ramify/receipt/builder.py
            backend/ramify/receipt/proof_pack.py
            backend/ramify/receipt/store.py
            backend/ramify/resolve/primitives.py
            backend/tests/test_backend_audit_26_sep_2026.py
            backend/tests/test_browser_e2e_optional.py
            backend/tests/test_client_feedback_21_sep_2026.py
            backend/tests/test_deep_audit_v3.py
            backend/tests/test_policy_and_scenarios.py
            backend/tests/test_release_check.py
            backend/tests/test_security_audit_sept_2026.py
            scripts/capture_release_evidence.py
            scripts/david_live_verification_demo.py
            scripts/live_llm_smoke.py
            scripts/package_leavebehind.py
            scripts/portable_verify.py
            scripts/release_check.py
            scripts/seed.py
          )
          for f in "${files[@]}"; do
            mkdir -p "Fastapi/$(dirname "$f")"
            cp -f "/tmp/nomaan/$f" "Fastapi/$f"
          done

          # Keep our final frontend/UX and monorepo workflow. This temporary
          # sync workflow removes itself before the integration commit.
          rm -f .github/workflows/security-sync.yml

      - name: Commit verified overlay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Fastapi .github/workflows/security-sync.yml
          git status --short
          git commit -m "Port Nomaan security backend onto final UX"
          git push origin security-ux-integration
