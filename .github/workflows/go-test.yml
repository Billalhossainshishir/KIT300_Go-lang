name: Go validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Golang
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: Golang/go.mod

      - name: Go tests
        run: go test -count=1 ./...

      - name: Go vet
        run: go vet ./...

      - name: JavaScript syntax
        run: |
          for file in frontend/scripts/*.js; do
            node --check "$file"
          done
