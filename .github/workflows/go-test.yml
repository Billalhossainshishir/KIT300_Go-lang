name: Project validation

on:
  push:
  pull_request:

jobs:
  go:
    name: Go validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Golang
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: Golang/go.mod

      - name: Go tests
        run: go test -count=1 ./...

      - name: Go vet
        run: go vet ./...

      - name: Go frontend JavaScript syntax
        run: |
          for file in frontend/scripts/*.js; do
            node --check "$file"
          done

  fastapi:
    name: FastAPI validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Fastapi
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Fastapi/requirements.txt

      - name: Install FastAPI project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: FastAPI tests
        run: python -m pytest -q

      - name: FastAPI frontend JavaScript syntax
        run: |
          for file in frontend/scripts/*.js; do
            node --check "$file"
          done
