name: Build Windows RAMIFY launchers

on:
  push:
    branches:
      - main
    paths:
      - 'Golang/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-launcher-build-main
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build RAMIFY.exe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: Golang/go.mod

      - name: Validate Go source
        working-directory: Golang
        run: |
          go test -count=1 ./...
          go vet ./...

      - name: Build Windows executables
        working-directory: Golang
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p bin
          go build -trimpath -buildvcs=false -ldflags="-s -w" -o bin/RAMIFY.exe ./cmd/ramify
          go build -trimpath -buildvcs=false -ldflags="-s -w" -o bin/RAMIFY-Verify.exe ./cmd/verify
          test -s bin/RAMIFY.exe
          test -s bin/RAMIFY-Verify.exe

      - name: Upload ready-to-run Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: RAMIFY-Windows-amd64
          path: |
            Golang/bin/RAMIFY.exe
            Golang/bin/RAMIFY-Verify.exe
          if-no-files-found: error

      - name: Keep launchers in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Golang/bin/RAMIFY.exe Golang/bin/RAMIFY-Verify.exe
          if git diff --cached --quiet; then
            echo "Windows launchers are already current."
            exit 0
          fi
          git commit -m "Build Windows RAMIFY launchers [skip ci]"
          git push origin HEAD:main
